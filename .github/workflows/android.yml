name: Ember Android APK
on:
  push:
    branches: [v3_openjdk, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.3.13750724'
      - name: Get bundled Java 8 runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'
      - name: Generate language list
        run: bash scripts/languagelist_updater.sh
      - name: Build installable APK
        run: gradle :app_pojavlauncher:assembleDebug --stacktrace
      - name: Package APK and checksum
        run: |
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/debug/*.apk out/Ember-Launcher.apk
          cd out
          sha256sum Ember-Launcher.apk > Ember-Launcher.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-Launcher-APK
          path: out/*
          if-no-files-found: error
          retention-days: 30
